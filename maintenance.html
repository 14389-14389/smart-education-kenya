<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Education – Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(to right, #0284c7, #0ea5e9);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .countdown {
        font-size: 2rem;
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1 class="text-4xl font-bold mb-4">🚧 Smart Education is Under Maintenance 🚧</h1>
    <p class="text-lg">We’ll be back soon — thank you for your patience!</p>

    <div class="countdown" id="countdown"></div>

    <script>
      // Set countdown for 7 days from now
      const targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + 7);

      function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance <= 0) {
          document.getElementById("countdown").innerHTML = "✅ We're back online!";
          clearInterval(interval);

          // Redirect to the main website after 3 seconds
          setTimeout(() => {
            window.location.href = "index-original.html";
          }, 3000);
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerHTML =
          `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      const interval = setInterval(updateCountdown, 1000);
      updateCountdown();
    </script>
  </body>
</html>
