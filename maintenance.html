<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Education - Maintenance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      text-align: center;
      padding: 100px 20px;
    }
    h1 {
      font-size: 2.5em;
      color: #0078d7;
    }
    #countdown {
      font-size: 2em;
      margin-top: 30px;
      color: #222;
    }
    footer {
      margin-top: 80px;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>🚧 Smart Education is Under Maintenance 🚧</h1>
  <p>We’re making improvements to serve you better.<br>
  The site will be back online in:</p>
  <div id="countdown"></div>

  <footer>
    &copy; <span id="year"></span> SmartEducation.co.ke — All Rights Reserved
  </footer>

  <script>
    // Set countdown to 7 days from now
    const launchDate = new Date();
    launchDate.setDate(launchDate.getDate() + 7);

    const timer = setInterval(function() {
      const now = new Date().getTime();
      const distance = launchDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("countdown").innerHTML =
        days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

      if (distance < 0) {
        clearInterval(timer);
        document.getElementById("countdown").innerHTML = "We're back online!";
      }
    }, 1000);

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
